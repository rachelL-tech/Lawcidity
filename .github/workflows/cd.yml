name: deploy

on: [push]

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with: 
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/lawcidity
            git pull
            docker compose -f docker-compose.prod.yml --env-file .env build --progress=plain
            docker compose -f docker-compose.prod.yml --env-file .env up -d nginx fastapi
            for i in {1..10}; do
              if curl -fsS http://localhost/api/ready; then
                exit 0
              fi
              sleep 2
            done
            echo "ERROR: /api/ready did not become healthy" >&2
            exit 1
