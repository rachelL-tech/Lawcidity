name: tests

on: 
  push:
  workflow_call:

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      # git clone my repo to runner
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/unit/
